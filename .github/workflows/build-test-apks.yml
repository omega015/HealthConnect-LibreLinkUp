name: Build test APKs

on:
  push:
    branches:
      - fix-locale-timestamps
      - faster-5-minute-sync
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: ${{ runner.os }}-android-debug-keystore-v2

      - name: Ensure persistent debug signing key
        shell: bash
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$ANDROID_USER_HOME/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v \
            -keystore "$ANDROID_USER_HOME/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA256:|Valid from:"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build phone and watch debug APKs
        run: ./gradlew :app:assembleDebug :wearable:assembleDebug --stacktrace

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: wearable-debug-apk
          path: wearable/build/outputs/apk/debug/wearable-debug.apk
