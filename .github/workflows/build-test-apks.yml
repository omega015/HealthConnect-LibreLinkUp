name: Build test APKs

on:
  push:
    branches:
      - fix-locale-timestamps
      - faster-5-minute-sync
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-android-debug-keystore-v1

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build phone and watch debug APKs
        run: ./gradlew :app:assembleDebug :wearable:assembleDebug --stacktrace

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: wearable-debug-apk
          path: wearable/build/outputs/apk/debug/wearable-debug.apk
