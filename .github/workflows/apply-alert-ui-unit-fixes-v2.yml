name: Apply alert UI and Wear unit fixes v2

on:
  push:
    branches:
      - configurable-foreground-sync

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse patch script and fix Tile class closure
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-alert-ui-unit-fixes.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/apply_alert_fixes.py').write_text(textwrap.dedent(workflow[start:end]))
          PY

          python3 /tmp/apply_alert_fixes.py

          python3 <<'PY'
          from pathlib import Path

          path = Path('wearable/src/main/java/org/c99/healthconnect_librelinkup/tile/GlucoseTileService.kt')
          text = path.read_text()
          marker = '    }\n\n@SuppressLint("DefaultLocale")\nprivate fun tileLayout'
          replacement = '    }\n}\n\n@SuppressLint("DefaultLocale")\nprivate fun tileLayout'
          if marker not in text:
              raise SystemExit('Tile class-closure marker not found')
          path.write_text(text.replace(marker, replacement, 1))
          PY

          git rm .github/workflows/apply-alert-ui-unit-fixes.yml
          git rm .github/workflows/apply-alert-ui-unit-fixes-v2.yml
          git diff --check
          git diff --stat

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: ${{ runner.os }}-android-debug-keystore-v3

      - name: Ensure debug key
        shell: bash
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build patched phone and watch APKs
        run: chmod +x gradlew && ./gradlew :app:assembleDebug :wearable:assembleDebug --stacktrace

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine alert UI, validation and Wear units"
          git push origin HEAD:configurable-foreground-sync

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: wearable-debug-apk
          path: wearable/build/outputs/apk/debug/wearable-debug.apk
