name: Apply alert UI and Wear unit fixes

on:
  push:
    branches:
      - configurable-foreground-sync

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing marker for {label}")
              return text.replace(old, new, 1)

          def replace_between(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"Missing start marker for {label}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"Missing end marker for {label}")
              return text[:start] + replacement + text[end:]

          # Phone UI, validation and grouping.
          path = "app/src/main/java/org/c99/healthconnect_librelinkup/MainActivity.kt"
          text = read(path)
          save_fn = '''    private fun onSaveAlertSettings() {
              val state = viewModel.uiState.value
              val lowMgDl = valueToMgDl(state.lowAlertThreshold, state.alertUnits)
              val highMgDl = valueToMgDl(state.highAlertThreshold, state.alertUnits)
              val lowHysteresisMgDl = valueToMgDl(state.lowHysteresis, state.alertUnits, true)
              val highHysteresisMgDl = valueToMgDl(state.highHysteresis, state.alertUnits, true)
              val lowDisplay = state.lowAlertThreshold.trim().replace(',', '.').toFloatOrNull()
              val highDisplay = state.highAlertThreshold.trim().replace(',', '.').toFloatOrNull()
              val lowHysteresisDisplay = state.lowHysteresis.trim().replace(',', '.').toFloatOrNull()
              val highHysteresisDisplay = state.highHysteresis.trim().replace(',', '.').toFloatOrNull()

              if (
                  lowMgDl == null || highMgDl == null ||
                  lowHysteresisMgDl == null || highHysteresisMgDl == null ||
                  lowDisplay == null || highDisplay == null ||
                  lowHysteresisDisplay == null || highHysteresisDisplay == null
              ) {
                  Toast.makeText(this, getString(R.string.alert_settings_invalid), Toast.LENGTH_LONG).show()
                  return
              }

              val thresholdsValid = if (state.alertUnits == GlucoseAlertSettings.UNITS_MGDL) {
                  lowDisplay in 60f..100f && highDisplay in 120f..400f
              } else {
                  lowDisplay in 3.3f..5.6f && highDisplay in 6.7f..22.2f
              }
              if (!thresholdsValid) {
                  val message = if (state.alertUnits == GlucoseAlertSettings.UNITS_MGDL) {
                      R.string.alert_settings_threshold_range_mgdl
                  } else {
                      R.string.alert_settings_threshold_range_mmol
                  }
                  Toast.makeText(this, getString(message), Toast.LENGTH_LONG).show()
                  return
              }

              val maxHysteresis = if (state.alertUnits == GlucoseAlertSettings.UNITS_MGDL) 9f else 0.5f
              if (lowHysteresisDisplay !in 0f..maxHysteresis || highHysteresisDisplay !in 0f..maxHysteresis) {
                  val message = if (state.alertUnits == GlucoseAlertSettings.UNITS_MGDL) {
                      R.string.alert_settings_hysteresis_range_mgdl
                  } else {
                      R.string.alert_settings_hysteresis_range_mmol
                  }
                  Toast.makeText(this, getString(message), Toast.LENGTH_LONG).show()
                  return
              }

              if (lowMgDl + lowHysteresisMgDl >= highMgDl - highHysteresisMgDl) {
                  Toast.makeText(this, getString(R.string.alert_settings_rearm_overlap), Toast.LENGTH_LONG).show()
                  return
              }

              alertSettings.saveAndSend(
                  state.lowAlertEnabled,
                  lowMgDl,
                  state.lowPersistentVibration,
                  state.lowRepeatEnabled,
                  state.lowRepeatIntervalMinutes,
                  lowHysteresisMgDl,
                  state.highAlertEnabled,
                  highMgDl,
                  state.highPersistentVibration,
                  state.highRepeatEnabled,
                  state.highRepeatIntervalMinutes,
                  highHysteresisMgDl,
                  state.alertUnits
              )
              Toast.makeText(this, getString(R.string.alert_settings_saved), Toast.LENGTH_SHORT).show()
          }

          '''
          text = replace_between(
              text,
              "    private fun onSaveAlertSettings() {",
              "    private fun checkPermissions() {",
              save_fn,
              "onSaveAlertSettings"
          )

          low_high_ui = '''                Row(
                      modifier = Modifier.fillMaxWidth().padding(top = 8.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(stringResource(id = R.string.low_alert_enabled))
                      Switch(
                          checked = uiState.lowAlertEnabled,
                          onCheckedChange = { viewModel.setLowAlertEnabled(it) }
                      )
                  }
                  OutlinedTextField(
                      value = uiState.lowAlertThreshold,
                      onValueChange = { viewModel.setLowAlertThreshold(it) },
                      enabled = uiState.lowAlertEnabled,
                      label = { Text(stringResource(id = R.string.low_alert_threshold)) },
                      suffix = { Text(if (uiState.alertUnits == GlucoseAlertSettings.UNITS_MGDL) "mg/dL" else "mmol/L") },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      modifier = Modifier.fillMaxWidth()
                  )
                  OutlinedTextField(
                      value = uiState.lowHysteresis,
                      onValueChange = { viewModel.setLowHysteresis(it) },
                      enabled = uiState.lowAlertEnabled,
                      label = { Text(stringResource(id = R.string.rearm_margin)) },
                      suffix = { Text(if (uiState.alertUnits == GlucoseAlertSettings.UNITS_MGDL) "mg/dL" else "mmol/L") },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      modifier = Modifier.fillMaxWidth()
                  )
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(stringResource(id = R.string.persistent_vibration))
                      Switch(
                          checked = uiState.lowPersistentVibration,
                          onCheckedChange = { viewModel.setLowPersistentVibration(it) },
                          enabled = uiState.lowAlertEnabled
                      )
                  }
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(stringResource(id = R.string.repeat_alert))
                      Switch(
                          checked = uiState.lowRepeatEnabled,
                          onCheckedChange = { viewModel.setLowRepeatEnabled(it) },
                          enabled = uiState.lowAlertEnabled
                      )
                  }
                  ExposedDropdownMenuBox(
                      expanded = lowRepeatExpanded,
                      onExpandedChange = {
                          if (uiState.lowAlertEnabled && uiState.lowRepeatEnabled) {
                              lowRepeatExpanded = !lowRepeatExpanded
                          }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      OutlinedTextField(
                          value = stringResource(id = R.string.repeat_interval_value, uiState.lowRepeatIntervalMinutes),
                          onValueChange = {},
                          readOnly = true,
                          enabled = uiState.lowAlertEnabled && uiState.lowRepeatEnabled,
                          label = { Text(stringResource(id = R.string.repeat_interval)) },
                          trailingIcon = { ExposedDropdownMenuDefaults.TrailingIcon(expanded = lowRepeatExpanded) },
                          modifier = Modifier.menuAnchor(MenuAnchorType.PrimaryNotEditable).fillMaxWidth()
                      )
                      ExposedDropdownMenu(
                          expanded = lowRepeatExpanded,
                          onDismissRequest = { lowRepeatExpanded = false }
                      ) {
                          listOf(1, 2, 5, 10, 15, 30, 60).forEach { minutes ->
                              DropdownMenuItem(
                                  text = { Text(stringResource(id = R.string.repeat_interval_value, minutes)) },
                                  onClick = {
                                      viewModel.setLowRepeatIntervalMinutes(minutes)
                                      lowRepeatExpanded = false
                                  }
                              )
                          }
                      }
                  }

                  Row(
                      modifier = Modifier.fillMaxWidth().padding(top = 8.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(stringResource(id = R.string.high_alert_enabled))
                      Switch(
                          checked = uiState.highAlertEnabled,
                          onCheckedChange = { viewModel.setHighAlertEnabled(it) }
                      )
                  }
                  OutlinedTextField(
                      value = uiState.highAlertThreshold,
                      onValueChange = { viewModel.setHighAlertThreshold(it) },
                      enabled = uiState.highAlertEnabled,
                      label = { Text(stringResource(id = R.string.high_alert_threshold)) },
                      suffix = { Text(if (uiState.alertUnits == GlucoseAlertSettings.UNITS_MGDL) "mg/dL" else "mmol/L") },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      modifier = Modifier.fillMaxWidth()
                  )
                  OutlinedTextField(
                      value = uiState.highHysteresis,
                      onValueChange = { viewModel.setHighHysteresis(it) },
                      enabled = uiState.highAlertEnabled,
                      label = { Text(stringResource(id = R.string.rearm_margin)) },
                      suffix = { Text(if (uiState.alertUnits == GlucoseAlertSettings.UNITS_MGDL) "mg/dL" else "mmol/L") },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      modifier = Modifier.fillMaxWidth()
                  )
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(stringResource(id = R.string.persistent_vibration))
                      Switch(
                          checked = uiState.highPersistentVibration,
                          onCheckedChange = { viewModel.setHighPersistentVibration(it) },
                          enabled = uiState.highAlertEnabled
                      )
                  }
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(stringResource(id = R.string.repeat_alert))
                      Switch(
                          checked = uiState.highRepeatEnabled,
                          onCheckedChange = { viewModel.setHighRepeatEnabled(it) },
                          enabled = uiState.highAlertEnabled
                      )
                  }
                  ExposedDropdownMenuBox(
                      expanded = highRepeatExpanded,
                      onExpandedChange = {
                          if (uiState.highAlertEnabled && uiState.highRepeatEnabled) {
                              highRepeatExpanded = !highRepeatExpanded
                          }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      OutlinedTextField(
                          value = stringResource(id = R.string.repeat_interval_value, uiState.highRepeatIntervalMinutes),
                          onValueChange = {},
                          readOnly = true,
                          enabled = uiState.highAlertEnabled && uiState.highRepeatEnabled,
                          label = { Text(stringResource(id = R.string.repeat_interval)) },
                          trailingIcon = { ExposedDropdownMenuDefaults.TrailingIcon(expanded = highRepeatExpanded) },
                          modifier = Modifier.menuAnchor(MenuAnchorType.PrimaryNotEditable).fillMaxWidth()
                      )
                      ExposedDropdownMenu(
                          expanded = highRepeatExpanded,
                          onDismissRequest = { highRepeatExpanded = false }
                      ) {
                          listOf(1, 2, 5, 10, 15, 30, 60).forEach { minutes ->
                              DropdownMenuItem(
                                  text = { Text(stringResource(id = R.string.repeat_interval_value, minutes)) },
                                  onClick = {
                                      viewModel.setHighRepeatIntervalMinutes(minutes)
                                      highRepeatExpanded = false
                                  }
                              )
                          }
                      }
                  }

          '''
          low_text = "Text(stringResource(id = R.string.low_alert_enabled))"
          low_pos = text.find(low_text)
          if low_pos < 0:
              raise SystemExit("Low alert UI marker not found")
          ui_start = text.rfind("                Row(", 0, low_pos)
          save_pos = text.find("                Button(\n                    onClick = onSaveAlertSettings", low_pos)
          if ui_start < 0 or save_pos < 0:
              raise SystemExit("Alert UI boundaries not found")
          text = text[:ui_start] + low_high_ui + text[save_pos:]
          text = text.replace(
              "modifier = Modifier.fillMaxWidth()\n                ) {\n                    Text(stringResource(id = R.string.save_alert_settings))",
              "modifier = Modifier.fillMaxWidth().padding(top = 8.dp)\n                ) {\n                    Text(stringResource(id = R.string.save_alert_settings))",
              1
          )
          write(path, text)

          # Phone strings.
          path = "app/src/main/res/values/strings.xml"
          text = read(path)
          text = replace_once(text, '<string name="alert_units_label">Alert units</string>', '<string name="alert_units_label">Watch glucose units</string>', "units label")
          text = replace_once(text, '<string name="alert_settings_invalid">Enter valid thresholds and non-negative re-arm margins, with low below high.</string>', '''<string name="alert_settings_invalid">Enter valid numeric alert values.</string>
              <string name="alert_settings_threshold_range_mmol">Low 3.3–5.6 mmol/L; high 6.7–22.2 mmol/L.</string>
              <string name="alert_settings_threshold_range_mgdl">Low 60–100 mg/dL; high 120–400 mg/dL.</string>
              <string name="alert_settings_hysteresis_range_mmol">Re-arm margin must be 0–0.5 mmol/L.</string>
              <string name="alert_settings_hysteresis_range_mgdl">Re-arm margin must be 0–9 mg/dL.</string>
              <string name="alert_settings_rearm_overlap">Re-arm margins leave no neutral range.</string>''', "validation strings")
          write(path, text)

          # Phone alert settings: sanitize old test values and send display units to Wear.
          path = "app/src/main/java/org/c99/healthconnect_librelinkup/GlucoseAlertSettings.java"
          text = read(path)
          text = replace_once(text,
              '    public static final float DEFAULT_LOW_THRESHOLD_MGDL = 70f;',
              '''    public static final float MIN_LOW_THRESHOLD_MGDL = 60f;
              public static final float MAX_LOW_THRESHOLD_MGDL = 100f;
              public static final float MIN_HIGH_THRESHOLD_MGDL = 120f;
              public static final float MAX_HIGH_THRESHOLD_MGDL = 400f;
              public static final float MAX_HYSTERESIS_MGDL = 9f;
              public static final float DEFAULT_LOW_THRESHOLD_MGDL = 70f;''',
              "phone limits")
          text = replace_between(text, "    public float getLowThresholdMgDl() {", "    public boolean isLowPersistentVibrationEnabled() {", '''    public float getLowThresholdMgDl() {
              return Math.max(MIN_LOW_THRESHOLD_MGDL, Math.min(
                      MAX_LOW_THRESHOLD_MGDL,
                      preferences.getFloat(KEY_LOW_THRESHOLD_MGDL, DEFAULT_LOW_THRESHOLD_MGDL)
              ));
          }

              public float getHighThresholdMgDl() {
              return Math.max(MIN_HIGH_THRESHOLD_MGDL, Math.min(
                      MAX_HIGH_THRESHOLD_MGDL,
                      preferences.getFloat(KEY_HIGH_THRESHOLD_MGDL, DEFAULT_HIGH_THRESHOLD_MGDL)
              ));
          }

          ''', "threshold getters")
          text = replace_between(text, "    public float getLowHysteresisMgDl() {", "    public void saveAndSend(", '''    public float getLowHysteresisMgDl() {
              return Math.max(0f, Math.min(
                      MAX_HYSTERESIS_MGDL,
                      preferences.getFloat(KEY_LOW_HYSTERESIS_MGDL, DEFAULT_HYSTERESIS_MGDL)
              ));
          }

              public float getHighHysteresisMgDl() {
              return Math.max(0f, Math.min(
                      MAX_HYSTERESIS_MGDL,
                      preferences.getFloat(KEY_HIGH_HYSTERESIS_MGDL, DEFAULT_HYSTERESIS_MGDL)
              ));
          }

              public String getDisplayUnits() {
              String units = preferences.getString(KEY_DISPLAY_UNITS, UNITS_MMOL);
              return UNITS_MGDL.equals(units) ? UNITS_MGDL : UNITS_MMOL;
          }

          ''', "hysteresis getters")
          text = text.replace('.putFloat(KEY_LOW_THRESHOLD_MGDL, lowThresholdMgDl)', '.putFloat(KEY_LOW_THRESHOLD_MGDL, Math.max(MIN_LOW_THRESHOLD_MGDL, Math.min(MAX_LOW_THRESHOLD_MGDL, lowThresholdMgDl)))', 1)
          text = text.replace('.putFloat(KEY_HIGH_THRESHOLD_MGDL, highThresholdMgDl)', '.putFloat(KEY_HIGH_THRESHOLD_MGDL, Math.max(MIN_HIGH_THRESHOLD_MGDL, Math.min(MAX_HIGH_THRESHOLD_MGDL, highThresholdMgDl)))', 1)
          text = text.replace('.putFloat(KEY_LOW_HYSTERESIS_MGDL, Math.max(0f, lowHysteresisMgDl))', '.putFloat(KEY_LOW_HYSTERESIS_MGDL, Math.max(0f, Math.min(MAX_HYSTERESIS_MGDL, lowHysteresisMgDl)))', 1)
          text = text.replace('.putFloat(KEY_HIGH_HYSTERESIS_MGDL, Math.max(0f, highHysteresisMgDl))', '.putFloat(KEY_HIGH_HYSTERESIS_MGDL, Math.max(0f, Math.min(MAX_HYSTERESIS_MGDL, highHysteresisMgDl)))', 1)
          text = text.replace('.putString(KEY_DISPLAY_UNITS, displayUnits)', '.putString(KEY_DISPLAY_UNITS, UNITS_MGDL.equals(displayUnits) ? UNITS_MGDL : UNITS_MMOL)', 1)
          text = replace_once(text,
              '        request.getDataMap().putFloat(KEY_HIGH_HYSTERESIS_MGDL, getHighHysteresisMgDl());',
              '''        request.getDataMap().putFloat(KEY_HIGH_HYSTERESIS_MGDL, getHighHysteresisMgDl());
              request.getDataMap().putString(KEY_DISPLAY_UNITS, getDisplayUnits());''',
              "send display units")
          write(path, text)

          # Send canonical mg/dL alongside source glucose value.
          path = "app/src/main/java/org/c99/healthconnect_librelinkup/GlucoseSync.java"
          text = read(path)
          text = replace_once(text,
              '    private static final String GLUCOSE_KEY = "org.c99.healthconnect_librelinkup.glucose";',
              '''    private static final String GLUCOSE_KEY = "org.c99.healthconnect_librelinkup.glucose";
              private static final String GLUCOSE_MGDL_KEY = "org.c99.healthconnect_librelinkup.glucoseMgDl";''',
              "canonical glucose key")
          text = replace_once(text,
              '            putDataMapRequest.getDataMap().putFloat(GLUCOSE_KEY, gm.Value);',
              '''            putDataMapRequest.getDataMap().putFloat(GLUCOSE_KEY, gm.Value);
              putDataMapRequest.getDataMap().putFloat(GLUCOSE_MGDL_KEY, gm.ValueInMgPerDl);''',
              "canonical glucose payload")
          write(path, text)

          # Watch alert manager: thresholds remain canonical mg/dL; only presentation follows preference.
          path = "wearable/src/main/java/org/c99/healthconnect_librelinkup/GlucoseAlertManager.kt"
          text = read(path)
          text = replace_once(text,
              '    const val KEY_HIGH_HYSTERESIS_MGDL = "high_hysteresis_mgdl"',
              '''    const val KEY_HIGH_HYSTERESIS_MGDL = "high_hysteresis_mgdl"
              const val KEY_DISPLAY_UNITS = "display_units"
              const val UNITS_MMOL = "mmol"
              const val UNITS_MGDL = "mgdl"
              const val MIN_LOW_THRESHOLD_MGDL = 60f
              const val MAX_LOW_THRESHOLD_MGDL = 100f
              const val MIN_HIGH_THRESHOLD_MGDL = 120f
              const val MAX_HIGH_THRESHOLD_MGDL = 400f
              const val MAX_HYSTERESIS_MGDL = 9f''',
              "watch constants")
          evaluate_fn = '''    fun evaluate(context: Context, glucoseMgDl: Float) {
              val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
              val lowEnabled = prefs.getBoolean(KEY_LOW_ENABLED, false)
              val highEnabled = prefs.getBoolean(KEY_HIGH_ENABLED, false)

              if (!lowEnabled && !highEnabled) {
                  stopPersistentVibration(context)
                  return
              }

              val lowThreshold = prefs.getFloat(KEY_LOW_THRESHOLD_MGDL, DEFAULT_LOW_THRESHOLD_MGDL)
              val highThreshold = prefs.getFloat(KEY_HIGH_THRESHOLD_MGDL, DEFAULT_HIGH_THRESHOLD_MGDL)
              val lowHysteresis = prefs.getFloat(KEY_LOW_HYSTERESIS_MGDL, DEFAULT_HYSTERESIS_MGDL)
                  .coerceIn(0f, MAX_HYSTERESIS_MGDL)
              val highHysteresis = prefs.getFloat(KEY_HIGH_HYSTERESIS_MGDL, DEFAULT_HYSTERESIS_MGDL)
                  .coerceIn(0f, MAX_HYSTERESIS_MGDL)
              val previousState = prefs.getString(KEY_ALERT_STATE, STATE_NORMAL) ?: STATE_NORMAL

              val nextState = when {
                  lowEnabled && glucoseMgDl <= lowThreshold -> STATE_LOW
                  highEnabled && glucoseMgDl >= highThreshold -> STATE_HIGH
                  previousState == STATE_LOW && lowEnabled && glucoseMgDl < lowThreshold + lowHysteresis -> STATE_LOW
                  previousState == STATE_HIGH && highEnabled && glucoseMgDl > highThreshold - highHysteresis -> STATE_HIGH
                  else -> STATE_NORMAL
              }

              val editor = prefs.edit()
              if (nextState != previousState) {
                  editor.putString(KEY_ALERT_STATE, nextState)
                  if (nextState == STATE_LOW) editor.remove(KEY_LAST_LOW_ALERT_TIME_MS)
                  if (nextState == STATE_HIGH) editor.remove(KEY_LAST_HIGH_ALERT_TIME_MS)
                  if (nextState == STATE_NORMAL) {
                      editor.remove(KEY_LAST_LOW_ALERT_TIME_MS)
                      editor.remove(KEY_LAST_HIGH_ALERT_TIME_MS)
                  }
                  editor.apply()
              }

              if (nextState != previousState) {
                  val notificationManager = context.getSystemService(NotificationManager::class.java)
                  when (nextState) {
                      STATE_LOW -> notificationManager.cancel(HIGH_NOTIFICATION_ID)
                      STATE_HIGH -> notificationManager.cancel(LOW_NOTIFICATION_ID)
                      STATE_NORMAL -> {
                          notificationManager.cancel(LOW_NOTIFICATION_ID)
                          notificationManager.cancel(HIGH_NOTIFICATION_ID)
                      }
                  }
                  stopPersistentVibration(context)
              }

              when (nextState) {
                  STATE_LOW -> maybeAlert(context, true, glucoseMgDl, previousState != STATE_LOW)
                  STATE_HIGH -> maybeAlert(context, false, glucoseMgDl, previousState != STATE_HIGH)
                  STATE_NORMAL -> if (previousState != STATE_NORMAL) {
                      Log.i(TAG, "Glucose returned to alert re-arm range")
                  }
              }
          }

          '''
          text = replace_between(text, "    fun evaluate(", "    fun acknowledge(", evaluate_fn, "evaluate")
          maybe_fn = '''    private fun maybeAlert(
              context: Context,
              low: Boolean,
              glucoseMgDl: Float,
              enteredState: Boolean
          ) {
              val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
              val repeatEnabled = prefs.getBoolean(
                  if (low) KEY_LOW_REPEAT_ENABLED else KEY_HIGH_REPEAT_ENABLED,
                  false
              )
              val repeatMinutes = sanitizeRepeatInterval(
                  prefs.getInt(
                      if (low) KEY_LOW_REPEAT_INTERVAL_MINUTES else KEY_HIGH_REPEAT_INTERVAL_MINUTES,
                      DEFAULT_REPEAT_INTERVAL_MINUTES
                  )
              )
              val lastAlertKey = if (low) KEY_LAST_LOW_ALERT_TIME_MS else KEY_LAST_HIGH_ALERT_TIME_MS
              val lastAlertTime = prefs.getLong(lastAlertKey, 0L)
              val now = System.currentTimeMillis()
              val repeatDue = repeatEnabled && lastAlertTime > 0L &&
                  now - lastAlertTime >= repeatMinutes * 60_000L
              val shouldAlert = enteredState || lastAlertTime == 0L || repeatDue

              if (!shouldAlert) return

              if (showAlert(context, low, glucoseMgDl)) {
                  prefs.edit().putLong(lastAlertKey, now).apply()
                  if (repeatDue) {
                      Log.i(TAG, (if (low) "Low" else "High") + " glucose repeat alert posted")
                  }
              }
          }

          '''
          text = replace_between(text, "    private fun maybeAlert(", "    private fun showAlert(", maybe_fn, "maybeAlert")
          show_fn = '''    private fun showAlert(
              context: Context,
              low: Boolean,
              glucoseMgDl: Float
          ): Boolean {
              createNotificationChannels(context)

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                  context.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
              ) {
                  Log.w(TAG, "Glucose alert suppressed because watch notification permission is not granted")
                  return false
              }

              val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
              val persistentVibration = prefs.getBoolean(
                  if (low) KEY_LOW_PERSISTENT_VIBRATION else KEY_HIGH_PERSISTENT_VIBRATION,
                  false
              )
              val channelId = if (low) LOW_CHANNEL_ID else HIGH_CHANNEL_ID
              val notificationId = if (low) LOW_NOTIFICATION_ID else HIGH_NOTIFICATION_ID
              val title = context.getString(if (low) R.string.low_glucose_alert_title else R.string.high_glucose_alert_title)
              val displayUnits = prefs.getString(KEY_DISPLAY_UNITS, UNITS_MMOL) ?: UNITS_MMOL
              val formattedValue = if (displayUnits == UNITS_MGDL) {
                  String.format(Locale.US, "%.0f mg/dL", glucoseMgDl)
              } else {
                  String.format(Locale.US, "%.1f mmol/L", glucoseMgDl / 18f)
              }
              val message = context.getString(R.string.glucose_alert_value, formattedValue)

              val acknowledgeIntent = Intent(context, GlucoseAlertActionReceiver::class.java).setAction(
                  if (low) GlucoseAlertActionReceiver.ACTION_ACK_LOW else GlucoseAlertActionReceiver.ACTION_ACK_HIGH
              )
              val acknowledgePendingIntent = PendingIntent.getBroadcast(
                  context,
                  if (low) LOW_ACK_REQUEST_CODE else HIGH_ACK_REQUEST_CODE,
                  acknowledgeIntent,
                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
              )
              val dismissIntent = Intent(context, GlucoseAlertActionReceiver::class.java).setAction(
                  if (low) GlucoseAlertActionReceiver.ACTION_DISMISS_LOW else GlucoseAlertActionReceiver.ACTION_DISMISS_HIGH
              )
              val dismissPendingIntent = PendingIntent.getBroadcast(
                  context,
                  if (low) LOW_DISMISS_REQUEST_CODE else HIGH_DISMISS_REQUEST_CODE,
                  dismissIntent,
                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
              )

              val notification = Notification.Builder(context, channelId)
                  .setSmallIcon(R.mipmap.ic_launcher)
                  .setContentTitle(title)
                  .setContentText(message)
                  .setCategory(Notification.CATEGORY_ALARM)
                  .setVisibility(Notification.VISIBILITY_PUBLIC)
                  .setAutoCancel(true)
                  .setDeleteIntent(dismissPendingIntent)
                  .addAction(Notification.Action.Builder(null, context.getString(R.string.glucose_alert_acknowledge), acknowledgePendingIntent).build())
                  .build()

              context.getSystemService(NotificationManager::class.java).notify(notificationId, notification)
              if (persistentVibration) startPersistentVibration(context, low)

              Log.i(TAG, (if (low) "Low" else "High") + " glucose alert posted: " + formattedValue +
                  if (persistentVibration) " with persistent vibration" else "")
              return true
          }

