name: Apply alert UI and Wear unit fixes

on:
  push:
    branches:
      - configurable-foreground-sync

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count} for:\n{old[:160]}")
              p.write_text(text.replace(old, new, expected))

          main = "app/src/main/java/org/c99/healthconnect_librelinkup/MainActivity.kt"

          # Validation: Abbott-style threshold guardrails, a 0.5 mmol/L / 9 mg/dL
          # hysteresis cap, and a final no-overlap check for the re-arm bands.
          replace_exact(main, '''        if (
              lowMgDl == null ||
              highMgDl == null ||
              lowHysteresisMgDl == null ||
              highHysteresisMgDl == null ||
              lowMgDl >= highMgDl
          ) {
              Toast.makeText(this, getString(R.string.alert_settings_invalid), Toast.LENGTH_LONG).show()
              return
          }

          ''', '''        val lowDisplay = state.lowAlertThreshold.trim().replace(',', '.').toFloatOrNull()
          val highDisplay = state.highAlertThreshold.trim().replace(',', '.').toFloatOrNull()
          val lowHysteresisDisplay = state.lowHysteresis.trim().replace(',', '.').toFloatOrNull()
          val highHysteresisDisplay = state.highHysteresis.trim().replace(',', '.').toFloatOrNull()

          if (
              lowMgDl == null ||
              highMgDl == null ||
              lowHysteresisMgDl == null ||
              highHysteresisMgDl == null ||
              lowDisplay == null ||
              highDisplay == null ||
              lowHysteresisDisplay == null ||
              highHysteresisDisplay == null
          ) {
              Toast.makeText(this, getString(R.string.alert_settings_invalid), Toast.LENGTH_LONG).show()
              return
          }

          val thresholdsValid = if (state.alertUnits == GlucoseAlertSettings.UNITS_MGDL) {
              lowDisplay in 60f..100f && highDisplay in 120f..400f
          } else {
              lowDisplay in 3.3f..5.6f && highDisplay in 6.7f..22.2f
          }
          if (!thresholdsValid) {
              Toast.makeText(
                  this,
                  getString(
                      if (state.alertUnits == GlucoseAlertSettings.UNITS_MGDL) {
                          R.string.alert_settings_threshold_range_mgdl
                      } else {
                          R.string.alert_settings_threshold_range_mmol
                      }
                  ),
                  Toast.LENGTH_LONG
              ).show()
              return
          }

          val maxHysteresisDisplay =
              if (state.alertUnits == GlucoseAlertSettings.UNITS_MGDL) 9f else 0.5f
          if (
              lowHysteresisDisplay !in 0f..maxHysteresisDisplay ||
              highHysteresisDisplay !in 0f..maxHysteresisDisplay
          ) {
              Toast.makeText(
                  this,
                  getString(
                      if (state.alertUnits == GlucoseAlertSettings.UNITS_MGDL) {
                          R.string.alert_settings_hysteresis_range_mgdl
                      } else {
                          R.string.alert_settings_hysteresis_range_mmol
                      }
                  ),
                  Toast.LENGTH_LONG
              ).show()
              return
          }

          if (lowMgDl + lowHysteresisMgDl >= highMgDl - highHysteresisMgDl) {
              Toast.makeText(
                  this,
                  getString(R.string.alert_settings_rearm_overlap),
                  Toast.LENGTH_LONG
              ).show()
              return
          }

          ''')

          # Move Low re-arm margin directly below Low threshold.
          low_hys = '''                OutlinedTextField(
                      value = uiState.lowHysteresis,
                      onValueChange = { viewModel.setLowHysteresis(it) },
                      enabled = uiState.lowAlertEnabled,
                      label = { Text(stringResource(id = R.string.rearm_margin)) },
                      suffix = { Text(if (uiState.alertUnits == GlucoseAlertSettings.UNITS_MGDL) "mg/dL" else "mmol/L") },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      modifier = Modifier.fillMaxWidth()
                  )
          '''
          replace_exact(main, low_hys, '')
          low_threshold = '''                OutlinedTextField(
                      value = uiState.lowAlertThreshold,
                      onValueChange = { viewModel.setLowAlertThreshold(it) },
                      enabled = uiState.lowAlertEnabled,
                      label = { Text(stringResource(id = R.string.low_alert_threshold)) },
                      suffix = { Text(if (uiState.alertUnits == GlucoseAlertSettings.UNITS_MGDL) "mg/dL" else "mmol/L") },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      modifier = Modifier.fillMaxWidth()
                  )
          '''
          replace_exact(main, low_threshold, low_threshold + low_hys)

          # Move High re-arm margin directly below High threshold.
          high_hys = '''                OutlinedTextField(
                      value = uiState.highHysteresis,
                      onValueChange = { viewModel.setHighHysteresis(it) },
                      enabled = uiState.highAlertEnabled,
                      label = { Text(stringResource(id = R.string.rearm_margin)) },
                      suffix = { Text(if (uiState.alertUnits == GlucoseAlertSettings.UNITS_MGDL) "mg/dL" else "mmol/L") },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      modifier = Modifier.fillMaxWidth()
                  )
          '''
          replace_exact(main, high_hys, '')
          high_threshold = '''                OutlinedTextField(
                      value = uiState.highAlertThreshold,
                      onValueChange = { viewModel.setHighAlertThreshold(it) },
                      enabled = uiState.highAlertEnabled,
                      label = { Text(stringResource(id = R.string.high_alert_threshold)) },
                      suffix = { Text(if (uiState.alertUnits == GlucoseAlertSettings.UNITS_MGDL) "mg/dL" else "mmol/L") },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      modifier = Modifier.fillMaxWidth()
                  )
          '''
          replace_exact(main, high_threshold, high_threshold + high_hys)

          # Add extra visual separation before Low, High, and Save groups.
          replace_exact(main, '''                Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(stringResource(id = R.string.low_alert_enabled))
          ''', '''                Row(
                      modifier = Modifier.fillMaxWidth().padding(top = 8.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(stringResource(id = R.string.low_alert_enabled))
          ''')
          replace_exact(main, '''                Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(stringResource(id = R.string.high_alert_enabled))
          ''', '''                Row(
                      modifier = Modifier.fillMaxWidth().padding(top = 8.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(stringResource(id = R.string.high_alert_enabled))
          ''')
          replace_exact(main, '''                Button(
                      onClick = onSaveAlertSettings,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text(stringResource(id = R.string.save_alert_settings))
                  }
          ''', '''                Button(
                      onClick = onSaveAlertSettings,
                      modifier = Modifier.fillMaxWidth().padding(top = 8.dp)
                  ) {
                      Text(stringResource(id = R.string.save_alert_settings))
                  }
          ''')

          strings = "app/src/main/res/values/strings.xml"
          replace_exact(strings,
              '    <string name="alert_units_label">Alert units</string>\n',
              '    <string name="alert_units_label">Watch glucose units</string>\n')
          replace_exact(strings,
              '    <string name="alert_settings_invalid">Enter valid thresholds and non-negative re-arm margins, with low below high.</string>\n',
              '''    <string name="alert_settings_invalid">Enter valid numeric alert values.</string>
              <string name="alert_settings_threshold_range_mmol">Low 3.3–5.6 mmol/L; high 6.7–22.2 mmol/L.</string>
              <string name="alert_settings_threshold_range_mgdl">Low 60–100 mg/dL; high 120–400 mg/dL.</string>
              <string name="alert_settings_hysteresis_range_mmol">Re-arm margin must be 0–0.5 mmol/L.</string>
              <string name="alert_settings_hysteresis_range_mgdl">Re-arm margin must be 0–9 mg/dL.</string>
              <string name="alert_settings_rearm_overlap">Re-arm margins leave no neutral range.</string>
          ''')

          phone_settings = "app/src/main/java/org/c99/healthconnect_librelinkup/GlucoseAlertSettings.java"
          replace_exact(phone_settings, '''    public static final float DEFAULT_LOW_THRESHOLD_MGDL = 70f;
              public static final float DEFAULT_HIGH_THRESHOLD_MGDL = 180f;
              public static final float DEFAULT_HYSTERESIS_MGDL = 5f;
          ''', '''    public static final float MIN_LOW_THRESHOLD_MGDL = 60f;
              public static final float MAX_LOW_THRESHOLD_MGDL = 100f;
              public static final float MIN_HIGH_THRESHOLD_MGDL = 120f;
              public static final float MAX_HIGH_THRESHOLD_MGDL = 400f;
              public static final float MAX_HYSTERESIS_MGDL = 9f;
              public static final float DEFAULT_LOW_THRESHOLD_MGDL = 70f;
              public static final float DEFAULT_HIGH_THRESHOLD_MGDL = 180f;
              public static final float DEFAULT_HYSTERESIS_MGDL = 5f;
          ''')
          replace_exact(phone_settings, '''    public float getLowThresholdMgDl() {
              return preferences.getFloat(KEY_LOW_THRESHOLD_MGDL, DEFAULT_LOW_THRESHOLD_MGDL);
          }

              public float getHighThresholdMgDl() {
              return preferences.getFloat(KEY_HIGH_THRESHOLD_MGDL, DEFAULT_HIGH_THRESHOLD_MGDL);
          }
          ''', '''    public float getLowThresholdMgDl() {
              return Math.max(
                      MIN_LOW_THRESHOLD_MGDL,
                      Math.min(
                              MAX_LOW_THRESHOLD_MGDL,
                              preferences.getFloat(KEY_LOW_THRESHOLD_MGDL, DEFAULT_LOW_THRESHOLD_MGDL)
                      )
              );
          }

              public float getHighThresholdMgDl() {
              return Math.max(
                      MIN_HIGH_THRESHOLD_MGDL,
                      Math.min(
                              MAX_HIGH_THRESHOLD_MGDL,
                              preferences.getFloat(KEY_HIGH_THRESHOLD_MGDL, DEFAULT_HIGH_THRESHOLD_MGDL)
                      )
              );
          }
          ''')
          replace_exact(phone_settings, '''    public float getLowHysteresisMgDl() {
              return Math.max(
                      0f,
                      preferences.getFloat(KEY_LOW_HYSTERESIS_MGDL, DEFAULT_HYSTERESIS_MGDL)
              );
          }

              public float getHighHysteresisMgDl() {
              return Math.max(
                      0f,
                      preferences.getFloat(KEY_HIGH_HYSTERESIS_MGDL, DEFAULT_HYSTERESIS_MGDL)
              );
          }

              public String getDisplayUnits() {
              return preferences.getString(KEY_DISPLAY_UNITS, UNITS_MMOL);
          }
          ''', '''    public float getLowHysteresisMgDl() {
              return Math.max(
                      0f,
                      Math.min(
                              MAX_HYSTERESIS_MGDL,
                              preferences.getFloat(KEY_LOW_HYSTERESIS_MGDL, DEFAULT_HYSTERESIS_MGDL)
                      )
              );
          }

              public float getHighHysteresisMgDl() {
              return Math.max(
                      0f,
                      Math.min(
                              MAX_HYSTERESIS_MGDL,
                              preferences.getFloat(KEY_HIGH_HYSTERESIS_MGDL, DEFAULT_HYSTERESIS_MGDL)
                      )
              );
          }

              public String getDisplayUnits() {
              String units = preferences.getString(KEY_DISPLAY_UNITS, UNITS_MMOL);
              return UNITS_MGDL.equals(units) ? UNITS_MGDL : UNITS_MMOL;
          }
          ''')
          replace_exact(phone_settings, '''                .putFloat(KEY_LOW_THRESHOLD_MGDL, lowThresholdMgDl)
                  .putFloat(KEY_HIGH_THRESHOLD_MGDL, highThresholdMgDl)
          ''', '''                .putFloat(
                          KEY_LOW_THRESHOLD_MGDL,
                          Math.max(MIN_LOW_THRESHOLD_MGDL, Math.min(MAX_LOW_THRESHOLD_MGDL, lowThresholdMgDl))
                  )
                  .putFloat(
                          KEY_HIGH_THRESHOLD_MGDL,
                          Math.max(MIN_HIGH_THRESHOLD_MGDL, Math.min(MAX_HIGH_THRESHOLD_MGDL, highThresholdMgDl))
                  )
          ''')
          replace_exact(phone_settings, '''                .putFloat(KEY_LOW_HYSTERESIS_MGDL, Math.max(0f, lowHysteresisMgDl))
                  .putFloat(KEY_HIGH_HYSTERESIS_MGDL, Math.max(0f, highHysteresisMgDl))
                  .putString(KEY_DISPLAY_UNITS, displayUnits)
          ''', '''                .putFloat(
                          KEY_LOW_HYSTERESIS_MGDL,
                          Math.max(0f, Math.min(MAX_HYSTERESIS_MGDL, lowHysteresisMgDl))
                  )
                  .putFloat(
                          KEY_HIGH_HYSTERESIS_MGDL,
                          Math.max(0f, Math.min(MAX_HYSTERESIS_MGDL, highHysteresisMgDl))
                  )
                  .putString(KEY_DISPLAY_UNITS, UNITS_MGDL.equals(displayUnits) ? UNITS_MGDL : UNITS_MMOL)
          ''')
          replace_exact(phone_settings, '''        request.getDataMap().putFloat(KEY_LOW_HYSTERESIS_MGDL, getLowHysteresisMgDl());
              request.getDataMap().putFloat(KEY_HIGH_HYSTERESIS_MGDL, getHighHysteresisMgDl());
              request.getDataMap().putLong(KEY_REQUEST_ID, requestId);
          ''', '''        request.getDataMap().putFloat(KEY_LOW_HYSTERESIS_MGDL, getLowHysteresisMgDl());
              request.getDataMap().putFloat(KEY_HIGH_HYSTERESIS_MGDL, getHighHysteresisMgDl());
              request.getDataMap().putString(KEY_DISPLAY_UNITS, getDisplayUnits());
              request.getDataMap().putLong(KEY_REQUEST_ID, requestId);
          ''')

          glucose_sync = "app/src/main/java/org/c99/healthconnect_librelinkup/GlucoseSync.java"
          replace_exact(glucose_sync, '''    private static final String GLUCOSE_KEY = "org.c99.healthconnect_librelinkup.glucose";
              private static final String TREND_ARROW_KEY = "org.c99.healthconnect_librelinkup.trendArrow";
          ''', '''    private static final String GLUCOSE_KEY = "org.c99.healthconnect_librelinkup.glucose";
              private static final String GLUCOSE_MGDL_KEY = "org.c99.healthconnect_librelinkup.glucoseMgDl";
              private static final String TREND_ARROW_KEY = "org.c99.healthconnect_librelinkup.trendArrow";
          ''')
          replace_exact(glucose_sync, '''            putDataMapRequest.getDataMap().putFloat(GLUCOSE_KEY, gm.Value);
                  putDataMapRequest.getDataMap().putInt(COLOR_KEY, gm.MeasurementColor);
          ''', '''            putDataMapRequest.getDataMap().putFloat(GLUCOSE_KEY, gm.Value);
                  putDataMapRequest.getDataMap().putFloat(GLUCOSE_MGDL_KEY, gm.ValueInMgPerDl);
                  putDataMapRequest.getDataMap().putInt(COLOR_KEY, gm.MeasurementColor);
          ''')

          manager = "wearable/src/main/java/org/c99/healthconnect_librelinkup/GlucoseAlertManager.kt"
          replace_exact(manager, '''    const val KEY_LOW_HYSTERESIS_MGDL = "low_hysteresis_mgdl"
              const val KEY_HIGH_HYSTERESIS_MGDL = "high_hysteresis_mgdl"

              private const val KEY_ALERT_STATE = "alert_state"
          ''', '''    const val KEY_LOW_HYSTERESIS_MGDL = "low_hysteresis_mgdl"
              const val KEY_HIGH_HYSTERESIS_MGDL = "high_hysteresis_mgdl"
              const val KEY_DISPLAY_UNITS = "display_units"
              const val UNITS_MMOL = "mmol"
              const val UNITS_MGDL = "mgdl"
              const val MIN_LOW_THRESHOLD_MGDL = 60f
              const val MAX_LOW_THRESHOLD_MGDL = 100f
              const val MIN_HIGH_THRESHOLD_MGDL = 120f
              const val MAX_HIGH_THRESHOLD_MGDL = 400f
              const val MAX_HYSTERESIS_MGDL = 9f

              private const val KEY_ALERT_STATE = "alert_state"
          ''')
          replace_exact(manager,
              '    fun evaluate(context: Context, glucoseValue: Float, glucoseUnits: Int) {\n',
              '    fun evaluate(context: Context, glucoseMgDl: Float) {\n')
          replace_exact(manager,
              '        val glucoseMgDl = if (glucoseUnits == 1) glucoseValue else glucoseValue * 18f\n',
              '')
          replace_exact(manager,
              '''                glucoseValue = glucoseValue,
                  glucoseUnits = glucoseUnits,
          ''',
              '''                glucoseMgDl = glucoseMgDl,
          ''', expected=2)
          replace_exact(manager, '''    private fun maybeAlert(
              context: Context,
              low: Boolean,
              glucoseValue: Float,
              glucoseUnits: Int,
              enteredState: Boolean
          ) {
          ''', '''    private fun maybeAlert(
              context: Context,
              low: Boolean,
              glucoseMgDl: Float,
              enteredState: Boolean
          ) {
          ''')
          replace_exact(manager,
              '        if (showAlert(context, low, glucoseValue, glucoseUnits)) {\n',
              '        if (showAlert(context, low, glucoseMgDl)) {\n')
          replace_exact(manager, '''    private fun showAlert(
              context: Context,
              low: Boolean,
              glucoseValue: Float,
              glucoseUnits: Int
          ): Boolean {
          ''', '''    private fun showAlert(
              context: Context,
              low: Boolean,
              glucoseMgDl: Float
          ): Boolean {
          ''')
          replace_exact(manager, '''        val formattedValue = if (glucoseUnits == 1) {
              String.format(Locale.US, "%.0f mg/dL", glucoseValue)
          } else {
              String.format(Locale.US, "%.1f mmol/L", glucoseValue)
          }
          ''', '''        val displayUnits = prefs.getString(KEY_DISPLAY_UNITS, UNITS_MMOL) ?: UNITS_MMOL
          val formattedValue = if (displayUnits == UNITS_MGDL) {
              String.format(Locale.US, "%.0f mg/dL", glucoseMgDl)
          } else {
              String.format(Locale.US, "%.1f mmol/L", glucoseMgDl / 18f)
          }
          ''')
          replace_exact(manager,
              '.coerceAtLeast(0f)\n',
              '.coerceIn(0f, MAX_HYSTERESIS_MGDL)\n', expected=2)

          listener = "wearable/src/main/java/org/c99/healthconnect_librelinkup/DataLayerListenerService.kt"
          replace_exact(listener, '''        const val GLUCOSE_KEY: String = "org.c99.healthconnect_librelinkup.glucose"
              const val TREND_ARROW_KEY: String = "org.c99.healthconnect_librelinkup.trendArrow"
          ''', '''        const val GLUCOSE_KEY: String = "org.c99.healthconnect_librelinkup.glucose"
              const val GLUCOSE_MGDL_KEY: String = "org.c99.healthconnect_librelinkup.glucoseMgDl"
              const val TREND_ARROW_KEY: String = "org.c99.healthconnect_librelinkup.trendArrow"
          ''')
          replace_exact(listener, '''                    val glucoseValue = dataMap.getFloat(GLUCOSE_KEY)
                  val glucoseUnits = dataMap.getInt(UNITS_KEY)

                  val glucose =
                      applicationContext.getSharedPreferences("glucose", MODE_PRIVATE).edit()
                  glucose.putFloat(GLUCOSE_KEY, glucoseValue)
                  glucose.putInt(TREND_ARROW_KEY, dataMap.getInt(TREND_ARROW_KEY))
                  glucose.putInt(COLOR_KEY, dataMap.getInt(COLOR_KEY))
                  glucose.putInt(UNITS_KEY, glucoseUnits)
                  glucose.putString(TIMESTAMP_KEY, dataMap.getString(TIMESTAMP_KEY))
                  glucose.commit()

                  GlucoseAlertManager.evaluate(applicationContext, glucoseValue, glucoseUnits)
          ''', '''                    val glucoseValue = dataMap.getFloat(GLUCOSE_KEY)
                  val glucoseUnits = dataMap.getInt(UNITS_KEY)
                  val glucoseMgDl = if (dataMap.containsKey(GLUCOSE_MGDL_KEY)) {
                      dataMap.getFloat(GLUCOSE_MGDL_KEY)
                  } else if (glucoseUnits == 1) {
                      glucoseValue
                  } else {
                      glucoseValue * 18f
                  }

                  val glucose =
                      applicationContext.getSharedPreferences("glucose", MODE_PRIVATE).edit()
                  glucose.putFloat(GLUCOSE_KEY, glucoseValue)
                  glucose.putFloat(GLUCOSE_MGDL_KEY, glucoseMgDl)
                  glucose.putInt(TREND_ARROW_KEY, dataMap.getInt(TREND_ARROW_KEY))
                  glucose.putInt(COLOR_KEY, dataMap.getInt(COLOR_KEY))
                  glucose.putInt(UNITS_KEY, glucoseUnits)
                  glucose.putString(TIMESTAMP_KEY, dataMap.getString(TIMESTAMP_KEY))
                  glucose.commit()

                  GlucoseAlertManager.evaluate(applicationContext, glucoseMgDl)
          ''')
          replace_exact(listener, '''        val oldHighHysteresis = alertPrefs.getFloat(GlucoseAlertManager.KEY_HIGH_HYSTERESIS_MGDL, 5f)
              val previousState = alertPrefs.getString(KEY_ALERT_STATE, null)
          ''', '''        val oldHighHysteresis = alertPrefs.getFloat(GlucoseAlertManager.KEY_HIGH_HYSTERESIS_MGDL, 5f)
              val oldDisplayUnits = alertPrefs.getString(
                  GlucoseAlertManager.KEY_DISPLAY_UNITS,
                  GlucoseAlertManager.UNITS_MMOL
              ) ?: GlucoseAlertManager.UNITS_MMOL
              val previousState = alertPrefs.getString(KEY_ALERT_STATE, null)
          ''')
          replace_exact(listener, '''        val lowThreshold = floatValue(
              dataMap,
              GlucoseAlertManager.KEY_LOW_THRESHOLD_MGDL,
              oldLowThreshold
          )
          val highThreshold = floatValue(
              dataMap,
              GlucoseAlertManager.KEY_HIGH_THRESHOLD_MGDL,
              oldHighThreshold
          )
          ''', '''        val lowThreshold = floatValue(
              dataMap,
              GlucoseAlertManager.KEY_LOW_THRESHOLD_MGDL,
              oldLowThreshold
          ).coerceIn(
              GlucoseAlertManager.MIN_LOW_THRESHOLD_MGDL,
              GlucoseAlertManager.MAX_LOW_THRESHOLD_MGDL
          )
          val highThreshold = floatValue(
              dataMap,
              GlucoseAlertManager.KEY_HIGH_THRESHOLD_MGDL,
              oldHighThreshold
          ).coerceIn(
              GlucoseAlertManager.MIN_HIGH_THRESHOLD_MGDL,
              GlucoseAlertManager.MAX_HIGH_THRESHOLD_MGDL
          )
          ''')
          replace_exact(listener, '''        val lowHysteresis = floatValue(
              dataMap,
              GlucoseAlertManager.KEY_LOW_HYSTERESIS_MGDL,
              oldLowHysteresis
          )
          val highHysteresis = floatValue(
              dataMap,
              GlucoseAlertManager.KEY_HIGH_HYSTERESIS_MGDL,
              oldHighHysteresis
          )

          val lowDefinitionChanged = oldLowEnabled != lowEnabled ||
          ''', '''        val lowHysteresis = floatValue(
              dataMap,
              GlucoseAlertManager.KEY_LOW_HYSTERESIS_MGDL,
              oldLowHysteresis
          ).coerceIn(0f, GlucoseAlertManager.MAX_HYSTERESIS_MGDL)
          val highHysteresis = floatValue(
              dataMap,
              GlucoseAlertManager.KEY_HIGH_HYSTERESIS_MGDL,
              oldHighHysteresis
          ).coerceIn(0f, GlucoseAlertManager.MAX_HYSTERESIS_MGDL)
          val displayUnits = stringValue(
              dataMap,
              GlucoseAlertManager.KEY_DISPLAY_UNITS,
              oldDisplayUnits
          ).let {
              if (it == GlucoseAlertManager.UNITS_MGDL) {
                  GlucoseAlertManager.UNITS_MGDL
              } else {
                  GlucoseAlertManager.UNITS_MMOL
              }
          }

          val lowDefinitionChanged = oldLowEnabled != lowEnabled ||
          ''')
          replace_exact(listener, '''        val highDefinitionChanged = oldHighEnabled != highEnabled ||
              oldHighThreshold != highThreshold || oldHighHysteresis != highHysteresis
          val resetActiveState = (previousState == STATE_LOW && lowDefinitionChanged) ||
          ''', '''        val highDefinitionChanged = oldHighEnabled != highEnabled ||
              oldHighThreshold != highThreshold || oldHighHysteresis != highHysteresis
          val displayUnitsChanged = oldDisplayUnits != displayUnits
          val resetActiveState = (previousState == STATE_LOW && lowDefinitionChanged) ||
          ''')
          replace_exact(listener, '''            .putFloat(GlucoseAlertManager.KEY_LOW_HYSTERESIS_MGDL, lowHysteresis)
              .putFloat(GlucoseAlertManager.KEY_HIGH_HYSTERESIS_MGDL, highHysteresis)
          ''', '''            .putFloat(GlucoseAlertManager.KEY_LOW_HYSTERESIS_MGDL, lowHysteresis)
              .putFloat(GlucoseAlertManager.KEY_HIGH_HYSTERESIS_MGDL, highHysteresis)
              .putString(GlucoseAlertManager.KEY_DISPLAY_UNITS, displayUnits)
          ''')
          replace_exact(listener, '''        editor.apply()

          if (previousState == STATE_LOW && !lowEnabled) {
          ''', '''        if (!editor.commit()) {
              Log.e(TAG, "Failed to persist Wear alert settings; acknowledgement not sent")
              return
          }

          if (previousState == STATE_LOW && !lowEnabled) {
          ''')
          replace_exact(listener, '''        if (previousState == STATE_HIGH && !highEnabled) {
              GlucoseAlertManager.acknowledge(applicationContext, low = false)
          }

          Log.i(
          ''', '''        if (previousState == STATE_HIGH && !highEnabled) {
              GlucoseAlertManager.acknowledge(applicationContext, low = false)
          }

          if (displayUnitsChanged) {
