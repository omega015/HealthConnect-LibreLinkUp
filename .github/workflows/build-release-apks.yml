name: Build release APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build phone and watch release APKs
        run: ./gradlew :app:assembleRelease :wearable:assembleRelease --stacktrace

      - name: Report APK sizes
        shell: bash
        run: |
          echo "Release APK sizes:"
          find app/build/outputs/apk/release wearable/build/outputs/apk/release \
            -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
              bytes=$(stat -c '%s' "$apk")
              mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
              printf '%s: %s bytes (%s MiB)\n' "$apk" "$bytes" "$mib"
            done

      - name: Upload phone release APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload watch release APK
        uses: actions/upload-artifact@v4
        with:
          name: wearable-release-apk
          path: wearable/build/outputs/apk/release/*.apk
